<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JG Leather — Somu remonts, individuālā somu šūšana un ādas izstrādājumu izgatavošana Rīgā</title>
  <meta name="description" content="JG Leather Rīgā: somu remonts un restaurācija, individuālā somu šūšana, ādas izstrādājumu izgatavošana pēc pasūtījuma. Ремонт и реставрация сумок, пошив изделий из кожи в Риге. Bespoke leathercraft & bag repair in Riga.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1a1a1a;
      --text-main: #e8e8e8;
      --text-muted: #9e9e9e;
      --accent: #d4a373;
      --accent-dark: #b07d4b;
      --border: #2c2c2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      font-weight: 300;
      padding-bottom: 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Hero / Header Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 60px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 40px;
    }

    .avatar-wrapper {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--accent);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }

    .hero .tagline {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .hero .credentials {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Sections Shared Styling */
    section {
      margin-bottom: 50px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 24px;
      border-left: 3px solid var(--accent);
      padding-left: 14px;
    }

    /* Statement Block */
    .statement-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 4px;
      font-size: 1rem;
      color: #ccc;
    }

    .statement-card p {
      margin-bottom: 16px;
    }

    .statement-card p:last-child {
      margin-bottom: 0;
    }

    /* Timeline Section */
    .timeline {
      position: relative;
      border-left: 1px solid var(--border);
      margin-left: 10px;
      padding-left: 25px;
      margin-bottom: 50px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 30px;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -31px;
      top: 4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: var(--accent);
      border: 2px solid var(--bg-color);
    }

    .timeline-year {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .timeline-content h3 {
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .timeline-content p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Portfolio Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    /* Автоматический водяной знак с логотипом */
    .card-image {
      position: relative;
      display: block;
    }

    .card-image img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .card-image::after {
      content: "";
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 48px;
      height: 48px;
      background-image: url("logo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.75;
      pointer-events: none;
      border-radius: 50%;
    }

    .gallery-info {
      padding: 16px;
    }

    .gallery-info h4 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .gallery-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Contact & Links Bar */
    .contact-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 4px;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 24px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-decoration: none;
      border-radius: 3px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #121212;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 2.2rem; }
      .statement-card { padding: 20px; }
      .button-group { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
